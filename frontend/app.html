<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcadGuard Dashboard</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/plagiarism.css">

  <!-- Lucide Icons & Chart.js -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

  <style>
    /* Notifications Popover Dropdown */
    .notifications-popover {
      position: absolute;
      top: 60px;
      right: 20px;
      width: 360px;
      max-height: 480px;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .notifications-popover.active {
      display: flex;
    }

    .popover-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #F8FAFC;
    }

    .popover-body {
      overflow-y: auto;
      flex: 1;
      max-height: 380px;
    }
  </style>
</head>
<body id="app-root">

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-icon">AG</div>
        <div class="sidebar-brand-name">AcadGuard</div>
        <div class="sidebar-brand-badge">v1.0</div>
      </div>

      <ul class="sidebar-menu" id="sidebar-navigation">
        <!-- Injected dynamically by Navbar.renderSidebar() based on role -->
      </ul>

      <div class="sidebar-footer">
        <div class="user-avatar" id="sidebar-user-avatar">U</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">User Name</div>
          <div class="user-role" id="sidebar-user-role">Student</div>
        </div>
        <button class="btn btn-secondary btn-sm btn-icon" style="background:transparent; border-color:rgba(255,255,255,0.2); color:#FFFFFF;" title="Sign Out" onclick="Auth.logout()">
          <i data-lucide="log-out" style="width:16px; height:16px;"></i>
        </button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Navigation Bar -->
      <nav class="top-navbar">
        <div class="flex items-center gap-3">
          <button class="mobile-menu-toggle" onclick="Navbar.toggleMobileSidebar()">
            <i data-lucide="menu"></i>
          </button>
          <div class="page-heading" id="topbar-page-title">AcadGuard Workspace</div>
        </div>

        <div class="top-navbar-actions">
          <!-- Notification Bell -->
          <div style="position:relative;">
            <button id="notification-bell-btn" class="icon-btn" onclick="Navbar.toggleNotificationDropdown()" title="Notifications">
              <i data-lucide="bell" style="width:18px; height:18px;"></i>
              <span id="notification-badge" class="notification-badge" style="display:none;">0</span>
            </button>

            <!-- Notifications Slide-out Popover -->
            <div id="notifications-popover" class="notifications-popover">
              <div class="popover-header">
                <span style="font-weight:700; font-size:0.9rem; color:var(--text-main);">Notifications</span>
                <button class="btn btn-secondary btn-sm" style="padding:0.2rem 0.5rem; font-size:0.75rem;" onclick="Navbar.readAllNotifications()">Mark all read</button>
              </div>
              <div class="popover-body" id="notifications-dropdown-list">
                <div style="padding:1.5rem; text-align:center; color:var(--text-muted); font-size:0.85rem;">Loading alerts...</div>
              </div>
            </div>
          </div>

          <!-- User Profile Dropdown Button -->
          <div class="flex items-center gap-2" style="background:#F8FAFC; border:1px solid var(--border-light); padding:0.35rem 0.75rem; border-radius:var(--radius-full);">
            <div class="user-avatar" style="width:28px; height:28px; font-size:0.75rem;">
              <i data-lucide="user" style="width:14px; height:14px;"></i>
            </div>
            <button class="btn btn-sm btn-secondary" style="border:none; background:transparent; padding:0; font-size:0.8rem; color:var(--danger);" onclick="Auth.logout()">
              Logout
            </button>
          </div>
        </div>
      </nav>

      <!-- Main Dynamic Content View Area -->
      <main class="content-view" id="main-content-view">
        <div class="empty-state">
          <div class="spinner spinner-primary" style="margin:0 auto 1.5rem auto;"></div>
          <h3 class="empty-state-title">Loading Workspace...</h3>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toast-container"></div>

  <!-- Application Javascript Modules -->
  <script src="/static/js/config.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/components/modals.js"></script>
  <script src="/static/js/components/navbar.js"></script>
  <script src="/static/js/views/report_view.js"></script>
  <script src="/static/js/views/student.js"></script>
  <script src="/static/js/views/supervisor.js"></script>
  <script src="/static/js/views/admin.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
